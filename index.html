<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fraud Detection System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 50%, #0a0a1a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 880px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 2rem;
      background: linear-gradient(135deg, #1a0533 0%, #0d1f3c 100%);
      border-radius: 16px;
      border: 1px solid #3b1f6e;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 50%, #7c3aed22 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, #06b6d422 0%, transparent 50%);
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #38bdf8, #a78bfa);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
      margin-bottom: 0.5rem;
      position: relative;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    header p {
      color: #7dd3fc;
      font-size: 0.95rem;
      position: relative;
      letter-spacing: 0.03em;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed22, #06b6d422);
      border: 1px solid #7c3aed55;
      color: #a78bfa;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
    .card {
      background: linear-gradient(135deg, #111827 0%, #1a1f35 100%);
      border: 1px solid #2d3a5e;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 24px #7c3aed15;
    }
    .card h2 {
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.65rem;
    }
    .field label {
      display: block;
      font-size: 0.75rem;
      color: #7dd3fc;
      margin-bottom: 3px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #2d3a5e;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 7px 10px;
      font-size: 0.85rem;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px #7c3aed33;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    button {
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, opacity 0.2s;
      letter-spacing: 0.02em;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: scale(0.97); }
    .btn-predict {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      flex: 1;
      box-shadow: 0 4px 15px #7c3aed55;
      font-size: 1rem;
      padding: 13px 20px;
    }
    .btn-fill-legit {
      background: linear-gradient(135deg, #065f46, #047857);
      color: #6ee7b7;
      flex: 1;
    }
    .btn-fill-fraud {
      background: linear-gradient(135deg, #7f1d1d, #991b1b);
      color: #fca5a5;
      flex: 1;
    }
    .btn-clear {
      background: #1e2a3a;
      color: #94a3b8;
      border: 1px solid #2d3a5e;
    }
    #result-box {
      display: none;
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      margin-top: 1.5rem;
      border: 2px solid transparent;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    #result-box.legit {
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
      border-color: #10b981;
      box-shadow: 0 0 30px #10b98133;
    }
    #result-box.fraud {
      background: linear-gradient(135deg, #3b0000 0%, #7f1d1d 100%);
      border-color: #ef4444;
      box-shadow: 0 0 30px #ef444433;
    }
    #result-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    #result-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; }
    #result-sub { font-size: 0.92rem; color: #cbd5e1; }
    .loading {
      text-align: center;
      color: #a78bfa;
      padding: 1.2rem;
      display: none;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #7c3aed33;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .api-url { text-align: center; }
    .api-url input {
      background: #0d1117;
      border: 1px solid #2d3a5e;
      border-radius: 8px;
      color: #7dd3fc;
      padding: 8px 14px;
      font-size: 0.82rem;
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">MLOps · AI · Cloud</div>
    <h1>🛡 Fraud Detection System</h1>
    <p>Intelligent Self-Monitoring MLOps System with Automatic Model Drift Detection and Retraining</p>
  </header>

  <div class="card">
    <h2>⚡ API Endpoint</h2>
    <div class="api-url">
      <input type="text" id="api-url" value="https://ml-api-deployment-06qg.onrender.com/predict" />
    </div>
  </div>

  <div class="card">
    <h2>📊 Transaction Features</h2>
    <div class="grid" id="fields-grid"></div>
    <div class="btn-row">
      <button class="btn-fill-legit" onclick="fillSample(0)">✓ Legitimate Sample</button>
      <button class="btn-fill-fraud" onclick="fillSample(1)">⚠ Fraud Sample</button>
      <button class="btn-clear" onclick="clearFields()">✕ Clear</button>
    </div>
    <div class="btn-row">
      <button class="btn-predict" onclick="predict()">▶ Predict Transaction</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <span class="spinner"></span> Analyzing transaction...
  </div>

  <div id="result-box">
    <div id="result-icon"></div>
    <div id="result-title"></div>
    <div id="result-sub"></div>
  </div>

</div>
<script>
  const FIELDS = ["Time","V1","V2","V3","V4","V5","V6","V7","V8","V9","V10","V11","V12","V13","V14","V15","V16","V17","V18","V19","V20","V21","V22","V23","V24","V25","V26","V27","V28","Amount"];
  const LEGIT = [0,-1.3598071336738,-0.0727811733098497,2.53634673796914,1.37815522427443,-0.338320769942518,0.462387777762292,0.239598554061257,0.0986979012610507,0.363786969611213,0.0907941719789316,-0.551599533260813,-0.617800855762348,-0.991389847235408,-0.311169353699174,1.46817697209427,-0.470400525259478,0.207971241929242,0.0257905801985591,0.403992960255733,0.251412098239705,-0.018306777944153,0.277837575558899,-0.110473910188767,0.0669280749146731,0.128539358273528,-0.189114843888824,0.133558376740387,-0.0210530534538215,149.62];
  const FRAUD = [406,-3.0435406239976,-3.15730712090228,1.08846277997285,2.2886436183814,1.35980512966107,-1.06482252298131,0.325574266158614,-0.0677936531906277,-0.270952836212946,-0.838586564582682,-0.414575448285725,-0.503140859566552,0.676501544635863,-1.69202893305956,2.00063483909015,0.666779695901966,0.599717117642009,1.72532100745514,0.283344830149986,2.10233879259444,0.661695924400245,0.435477208966341,1.37596574254529,-0.293803152498322,0.279798031841214,-0.145361714815161,-0.252773122530705,0.0357642251788156,529.0];

  const grid = document.getElementById('fields-grid');
  FIELDS.forEach(name => {
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `<label>${name}</label><input type="number" id="f_${name}" step="any" placeholder="0" />`;
    grid.appendChild(div);
  });

  function fillSample(type) {
    const data = type === 0 ? LEGIT : FRAUD;
    FIELDS.forEach((name, i) => { document.getElementById('f_' + name).value = data[i]; });
  }

  function clearFields() {
    FIELDS.forEach(name => document.getElementById('f_' + name).value = '');
    document.getElementById('result-box').style.display = 'none';
  }

  async function predict() {
    const features = FIELDS.map(name => {
      const val = document.getElementById('f_' + name).value;
      return val === '' ? 0 : parseFloat(val);
    });
    const url = document.getElementById('api-url').value.trim();
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result-box');
    loading.style.display = 'block';
    resultBox.style.display = 'none';
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ features })
      });
      const data = await response.json();
      loading.style.display = 'none';
      resultBox.style.display = 'block';
      if (data.prediction === 0) {
        resultBox.className = 'legit';
        document.getElementById('result-icon').textContent = '✅';
        document.getElementById('result-title').textContent = 'Legitimate Transaction';
        document.getElementById('result-title').style.color = '#34d399';
        document.getElementById('result-sub').textContent = 'This transaction appears to be genuine. No fraud detected.';
      } else {
        resultBox.className = 'fraud';
        document.getElementById('result-icon').textContent = '🚨';
        document.getElementById('result-title').textContent = 'Fraudulent Transaction Detected!';
        document.getElementById('result-title').style.color = '#f87171';
        document.getElementById('result-sub').textContent = 'Warning: This transaction has been flagged as potentially fraudulent.';
      }
    } catch (err) {
      loading.style.display = 'none';
      resultBox.style.display = 'block';
      resultBox.className = 'fraud';
      document.getElementById('result-icon').textContent = '⚠️';
      document.getElementById('result-title').textContent = 'Connection Error';
      document.getElementById('result-title').style.color = '#f87171';
      document.getElementById('result-sub').textContent = 'Could not reach the API. Make sure Render is running (it may be sleeping).';
    }
  }
</script>
</body>
</html>
